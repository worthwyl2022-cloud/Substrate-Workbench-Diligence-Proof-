name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-benchmark:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Generate corpus manifest
        run: node scripts/generate-corpus-manifest.mjs
      - name: Run deterministic baseline benchmark
        env:
          BENCHMARK_RUN_ID: ci-baseline
        run: npm run benchmark
      - name: Verify baseline artifact integrity
        run: sha256sum --check results/ci-baseline.json.sha256
      - name: Run deterministic engine benchmark
        env:
          BENCHMARK_RUN_ID: ci-engine
        run: npm run benchmark:engine
      - name: Verify engine artifact integrity
        run: sha256sum --check results/ci-engine.json.sha256
      - name: Upload benchmark artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ci-benchmarks
          path: results/ci-*.json*
